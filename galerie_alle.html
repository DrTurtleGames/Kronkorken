<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bildergalerie</title>
  <link rel="stylesheet" href="galerie.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Gesamte Kronkorken Sammlung (stand: 12.08.2026)</h1>
  <p><a href="index.html" >Zurück</a></p>
<div class="sortierung">
  <span>Reihenfolge invertieren:</span>

  <label class="switch">
    <input type="checkbox" id="reverseToggle">
    <span class="slider"></span>
  </label>
</div>

<div class="galerie" id="galerie"></div>

  <div id="lightbox" onclick="zoom_out()">
    <div id="lightbox-content" onclick="event.stopPropagation()">
      <span id="bild-name"></span>
      <button id="close-lightbox" onclick="zoom_out()">×</button>
      <button id="prev-button"
              class="nav-button"
              onclick="vorherigesBild(event)">
      ❮
      </button>
      <button id="next-button"
              class="nav-button"
              onclick="naechstesBild(event)">
      ❯
      </button>
      <img id="grossbild" src="" alt="Vergrößertes Bild">
      <div id="bild-tags"></div>
    </div>
  </div>
</body>
</html>

<script>
  let bilder = [];
  let aktuellesBild = 0;

  // JSON laden
  fetch("bilder_tags.json")
    .then(response => response.json())
    .then(data => {
      bilder = data;
      zeigeBilder();
    })
    .catch(error => {
      console.error("Fehler beim Laden von bilder_tags.json:", error);
      zeigeBilder();
    });

  const galerie = document.getElementById("galerie");
  const reverseToggle = document.getElementById("reverseToggle");

  const anzahlBilder = 830;

  // Bilder anzeigen
  function zeigeBilder() {

    galerie.innerHTML = "";

    let start;
    let ende;
    let schritt;

    if (reverseToggle.checked) {

      start = anzahlBilder;
      ende = 1;
      schritt = -1;

    } else {

      start = 1;
      ende = anzahlBilder;
      schritt = 1;
    }

    for (
      let i = start;
      reverseToggle.checked ? i >= ende : i <= ende;
      i += schritt
    ) {

      const nummer = String(i).padStart(4, "0");

      const img = document.createElement("img");

      img.src = `Bilder/${nummer}.webp`;
      img.alt = `Bild ${nummer}`;
      img.loading = "lazy";

      img.onclick = () => zoom_in(img);

      galerie.appendChild(img);
    }
  }

  // Toggle
  reverseToggle.addEventListener("change", zeigeBilder);

  // Lightbox
  function zoom_in(bild) {

    const bilderGalerie = 
      Array.from(document.querySelectorAll("#galerie img"));

    aktuellesBild = bilderGalerie.indexOf(bild);

    zeigeBildInLightbox(bild);
  }


  function zeigeBildInLightbox(bild) {
    const lightbox = document.getElementById("lightbox");
    const grossbild = document.getElementById("grossbild");
    const bildname = document.getElementById("bild-name");
    const bildtags = document.getElementById("bild-tags");

    grossbild.src = bild.src;

    // Dateiname
    try {
      const url = decodeURIComponent(bild.src);
      const teile = url.split("/");
      const dateiname = teile[teile.length - 1]; // z.B. "Bilder/0001.webp"
      const nameOhneEndung = dateiname.replace(/\.[^/.]+$/, "");
    
      bildname.textContent = "#" + nameOhneEndung;

    // JSON-Eintrag suchen
    const eintrag = bilder.find(bildInfo => {
      const jsonDateiname = bildInfo.pfad.split("/").pop();
      return jsonDateiname === dateiname;
    });

    // Tags anzeigen
    bildtags.innerHTML = "";
    if (eintrag && eintrag.tags && eintrag.tags.length > 0) {
      eintrag.tags.forEach(tag => {
        const chip = document.createElement("span");
        chip.className = "tag-chip";
        chip.textContent = tag;
        bildtags.appendChild(chip);
      });
    } else {
      const chip = document.createElement("span");
      chip.className = "tag-chip";
      chip.textContent = "Keine Stichwörter";
      bildtags.appendChild(chip);
    }

    } catch (e) {
      bildname.textContent = "Unbekannt";
      bildtags.textContent = "";
    }

    lightbox.style.display = "flex"; 
  }


  function zoom_out() {

    document.getElementById("lightbox").style.display = "none";

  }

  function vorherigesBild(event) {

    event.stopPropagation();

    const bilderGalerie =
      Array.from(document.querySelectorAll("#galerie img"));

    if (aktuellesBild > 0) {

      aktuellesBild--;

      zeigeBildInLightbox(
        bilderGalerie[aktuellesBild]
      );
    }
  }


  function naechstesBild(event) {

    event.stopPropagation();

    const bilderGalerie =
      Array.from(document.querySelectorAll("#galerie img"));

    if (aktuellesBild < bilderGalerie.length - 1) {

      aktuellesBild++;

      zeigeBildInLightbox(
        bilderGalerie[aktuellesBild]
      );
    }
  }

</script>
